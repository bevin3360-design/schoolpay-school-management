{% extends 'base.html' %}
{% block content %}
<h1>Subject Management</h1>
<div class="card">
  <h2>Add Subject</h2>
  <form method="post" class="form-grid">
    <label>Subject name<input name="name" required></label>
    <label>Short name<input name="short_name"></label>
    <label>Grade level<input name="grade_level" value="All"></label>
    <button type="submit">Save Subject</button>
  </form>
</div>
<div class="card">
  <h2>Subject List</h2>
  <table>
    <thead><tr><th>Name</th><th>Short Name</th><th>Grade Level</th></tr></thead>
    <tbody>
      {% for subject in subjects %}
      <tr><td>{{ subject.name }}</td><td>{{ subject.short_name }}</td><td>{{ subject.grade_level }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
