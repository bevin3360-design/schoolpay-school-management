{% extends 'base.html' %}
{% block content %}
<div class="card login-card">
  <h1>Teacher Login</h1>
  <form method="post">
    <label>Username
      <input name="username" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Access System</button>
  </form>
</div>
{% endblock %}
